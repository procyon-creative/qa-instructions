name: E2E

# Playwright demo + collect/render smoke — main branch only to limit Actions cost.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
        working-directory: examples/basic
      - run: pnpm test
        working-directory: examples/basic
      - run: pnpm render
        working-directory: examples/basic

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-steps
          path: examples/basic/qa-steps-out/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            examples/basic/playwright-report/
            examples/basic/test-results/
          retention-days: 7
