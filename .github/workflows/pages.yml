name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'packages/qa-instructions/package.json'
      - 'README.md'
      - '.github/workflows/pages.yml'
  # Build and check the site on PRs that touch it. Not a required check, so it
  # can use paths; deploy below runs only off main.
  pull_request:
    paths:
      - 'docs-site/**'
      - 'packages/qa-instructions/package.json'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == 'procyon-creative'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      # Builds the site, then checks the built page (install command, trace
      # setting, links).
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
