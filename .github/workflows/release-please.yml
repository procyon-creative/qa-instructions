# Keep this filename: npm trusted publishing is bound to it
# (`npm trust github ... --file release-please.yml`, see docs/ci.md).
# Renaming it breaks npm publishing until a maintainer re-runs `npm trust`.
name: Release

on:
  push:
    branches: [main]
    paths: ['packages/qa-instructions/package.json']

permissions:
  contents: write # tag + GitHub release
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_DIR: packages/qa-instructions
  PACKAGE_NAME: '@procyon-creative/qa-instructions'

jobs:
  release:
    if: github.repository_owner == 'procyon-creative'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Release only when package.json's version has no vX.Y.Z tag yet. Deciding
      # on the tag, not on "the file changed", makes dependency-only edits and
      # re-runs of an already released version no-ops.
      - name: Decide whether to release
        id: version
        run: |
          version="$(jq -r .version "$PACKAGE_DIR/package.json")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # --exit-code: 0 = tag found, 2 = no such tag, anything else = error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
          case "$status" in
            0) echo "$tag already exists; nothing to release."
               echo "release=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "Releasing $tag."
               echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - uses: pnpm/action-setup@v6
        if: steps.version.outputs.release == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v7
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
        if: steps.version.outputs.release == 'true'

      - run: pnpm --filter "$PACKAGE_NAME" build
        if: steps.version.outputs.release == 'true'

      # Publish before tagging so a failed publish leaves no tag and a re-run
      # retries it. Skip if a previous attempt already published this version.
      - name: Publish to npm
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if npm view "$PACKAGE_NAME@${TAG#v}" version > /dev/null 2>&1; then
            echo "$PACKAGE_NAME@${TAG#v} is already on npm."
          else
            pnpm --filter "$PACKAGE_NAME" publish --access public --no-git-checks
          fi

      - name: Tag and create the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - uses: procyon-creative/jira-action-man@v2
        if: steps.version.outputs.release == 'true'
        id: jira
        with:
          projects: 'QI'
          from: 'commits'
          post_to_jira: true
          jira_comment_mode: minimal
          jira_base_url: ${{ secrets.JIRA_BASE_URL }}
          jira_email: ${{ secrets.JIRA_EMAIL }}
          jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
